name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  python:
    name: Python lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: cloudsentry
          POSTGRES_PASSWORD: cloudsentry
          POSTGRES_DB: cloudsentry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudsentry -d cloudsentry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cloudsentry:cloudsentry@localhost:5432/cloudsentry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e ./api -e ./worker -e ./simulator
      - name: Lint
        run: make lint
      - name: Migrate
        run: alembic -c api/alembic.ini upgrade head
      - name: Test
        run: make test

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
