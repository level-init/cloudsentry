[project]
name = "cloudsentry-api"
version = "0.1.0"
description = "CloudSentry API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
cloudsentry-api = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]
